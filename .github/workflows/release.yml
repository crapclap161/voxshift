name: Release

# Publishes a GitHub Release when a version tag is pushed, e.g.:
#   git tag -a v0.0.1 -m "VoxShift v0.0.1" && git push origin v0.0.1
# Assets: VoxShift-vX.Y.Z-win-x64-portable.exe, VoxShift-vX.Y.Z-win-x64.zip, SHA256SUMS.txt
# Alternatively run it manually ("Run workflow") with a tag such as v0.0.1: the workflow then creates the
# tag on the selected commit together with the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.0.1 (must match VersionPrefix)"
        required: true

permissions:
  contents: write # create the release and upload assets (GITHUB_TOKEN). No cloud identity is used.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, sign & publish ${{ inputs.tag || github.ref_name }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fail fast, before building anything: releases are never published unsigned. The two secrets are exposed to
      # the signing steps only (not job-wide), so no other step or third-party action can read them.
      - name: Validate signing key (secrets)
        id: cert
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }} # optional: only for a certificate file
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.VOXSHIFT_SIGNING_KEY || secrets.WINDOWS_CODESIGN_PFX_PASSWORD }} # VOXSHIFT_SIGNING_KEY = passphrase that defines the signing key (or the PFX password)
          WINDOWS_CODESIGN_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_THUMBPRINT }} # optional pin
        run: ./scripts/sign-executable.ps1 -ValidateOnly

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.1xx"

      - name: Verify tag matches project version
        id: version
        shell: pwsh
        run: |
          $v = (dotnet msbuild Directory.Build.props -getProperty:VersionPrefix).Trim()
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -ne "v$v") { throw "Tag '$tag' does not match the project version 'v$v' in Directory.Build.props." }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($v))\]" -Quiet)) { throw "CHANGELOG.md has no entry for $v." }
          if (-not (Test-Path "docs/release-notes/v$v.md")) { throw "Missing release notes docs/release-notes/v$v.md." }
          # Release title = first heading of the release notes, e.g. "VoxShift v0.0.3 — Soundboard Feature Release".
          $title = ((Get-Content "docs/release-notes/v$v.md" -Encoding utf8 -TotalCount 1) -replace '^#\s*', '').Trim()
          if (-not $title.StartsWith("VoxShift v$v")) { $title = "VoxShift v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "SOURCE_DATE_EPOCH=$((git log -1 --format=%ct).Trim())" >> $env:GITHUB_ENV

      - name: Verify documentation screenshots are in the tagged commit
        shell: pwsh
        run: |
          # Every image the README embeds must exist (screenshots are committed before tagging).
          $missing = @()
          foreach ($m in [regex]::Matches((Get-Content README.md -Raw -Encoding utf8), '(docs/screenshots/[^"''()\s]+\.png)')) {
            if (-not (Test-Path $m.Groups[1].Value)) { $missing += $m.Groups[1].Value }
          }
          if ($missing.Count -gt 0) { throw "README references missing screenshots: $($missing -join ', ')" }
          Write-Host "All README screenshots present."

      - name: Restore
        run: dotnet restore VoxShift.sln

      - name: Check formatting
        run: dotnet format VoxShift.sln --verify-no-changes --no-restore

      - name: Build & test
        run: |
          dotnet build VoxShift.sln -c Release --no-restore
          dotnet test tests/VoxShift.Core.Tests -c Release --no-build

      - name: Publish (self-contained, single file)
        run: dotnet publish src/VoxShift/VoxShift.csproj -c Release -r win-x64 -o publish

      - name: Sign VoxShift.exe (Authenticode, SHA-256, RFC 3161 timestamp)
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }} # optional: only for a certificate file
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.VOXSHIFT_SIGNING_KEY || secrets.WINDOWS_CODESIGN_PFX_PASSWORD }} # VOXSHIFT_SIGNING_KEY = passphrase that defines the signing key (or the PFX password)
          WINDOWS_CODESIGN_THUMBPRINT: ${{ vars.WINDOWS_CODESIGN_THUMBPRINT }}
        run: ./scripts/sign-executable.ps1 -Path publish/VoxShift.exe

      - name: Remove signing certificate from the runner
        if: always()
        shell: pwsh
        run: ./scripts/sign-executable.ps1 -Cleanup

      # A self-signed certificate is verified for integrity and for being THE expected certificate; it is never
      # reported as publicly trusted. A publicly trusted certificate must instead be trusted by Windows on its own.
      - name: Verify signature of the published executable
        shell: pwsh
        run: |
          $mode = if ('${{ steps.cert.outputs.self_signed }}' -eq 'true') { '-TrustSelfSigned' } else { '-RequirePublicTrust' }
          ./scripts/verify-signature.ps1 -Path publish/VoxShift.exe -ExpectedPublicKeySha256 '${{ steps.cert.outputs.key_sha256 }}' -RequireTimestamp $mode

      # The smoke test runs the SIGNED binary, so a signature that breaks the single-file bundle is caught here.
      - name: Smoke test (signed executable)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -ExePath publish/VoxShift.exe -ExpectedVersion ${{ steps.version.outputs.version }}

      # Package only after signing, so the portable EXE, the EXE inside the ZIP and the checksums all refer to the signed file.
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }} -PublishDir publish -OutputDir dist

      - name: Verify release assets (signatures and checksums)
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $portable = "dist/VoxShift-$tag-win-x64-portable.exe"
          $zip = "dist/VoxShift-$tag-win-x64.zip"
          $extract = Join-Path $env:RUNNER_TEMP 'zip-check'
          Expand-Archive $zip -DestinationPath $extract -Force
          $zipExe = Get-ChildItem $extract -Recurse -Filter VoxShift.exe | Select-Object -First 1
          if (-not $zipExe) { throw 'VoxShift.exe not found inside the ZIP.' }
          $mode = if ('${{ steps.cert.outputs.self_signed }}' -eq 'true') { '-TrustSelfSigned' } else { '-RequirePublicTrust' }
          ./scripts/verify-signature.ps1 -Path $portable, $zipExe.FullName -ExpectedPublicKeySha256 '${{ steps.cert.outputs.key_sha256 }}' -RequireTimestamp $mode
          if ((Get-FileHash $portable).Hash -ne (Get-FileHash $zipExe.FullName).Hash) { throw 'Portable EXE and the EXE inside the ZIP differ.' }
          # SHA256SUMS.txt must describe exactly the files that are about to be uploaded.
          $lines = Get-Content dist/SHA256SUMS.txt
          foreach ($file in $portable, $zip) {
            $expected = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $leaf = Split-Path -Leaf $file
            if (-not ($lines -contains "$expected  $leaf")) { throw "SHA256SUMS.txt does not contain the checksum of $leaf." }
          }
          Write-Host 'Signatures valid and from the expected certificate; ZIP and portable EXE identical; checksums match.'

      # The release text always states what kind of certificate was used, taken from the certificate itself.
      - name: Compose release notes
        shell: pwsh
        run: |
          $selfSigned = '${{ steps.cert.outputs.self_signed }}' -eq 'true'
          $trust = if ($selfSigned) {
            "**Self-signed certificate.** The signature proves the file is unmodified and was signed with the key identified below, but Windows does not trust this certificate by itself (it is not issued by a public certification authority), so it does not establish a verified publisher and SmartScreen warnings can still appear. Compare the key fingerprint to confirm the file comes from the VoxShift release key."
          } else {
            "Signed with a certificate that chains to a root trusted by Windows. SmartScreen reputation is separate and can still take time to build."
          }
          $body = (Get-Content docs/release-notes/${{ steps.version.outputs.tag }}.md -Raw -Encoding utf8).TrimEnd() + @"


          ## Digital signature
          $trust

          | | |
          |---|---|
          | Signer | ``${{ steps.cert.outputs.subject }}`` |
          | Signing key SHA-256 (identity) | ``${{ steps.cert.outputs.key_sha256 }}`` |
          | Digest / timestamp | SHA-256, RFC 3161 timestamped |
          | Publicly trusted | $(if ($selfSigned) { 'No' } else { 'Yes' }) |

          Check it: ``Get-AuthenticodeSignature .\VoxShift-${{ steps.version.outputs.tag }}-win-x64-portable.exe | Format-List`` (see the README).
          "@
          Set-Content -Path dist/release-body.md -Value $body -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          body_path: dist/release-body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/VoxShift-${{ steps.version.outputs.tag }}-win-x64-portable.exe
            dist/VoxShift-${{ steps.version.outputs.tag }}-win-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
