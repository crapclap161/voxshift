name: Release

# Publishes a GitHub Release when a version tag is pushed, e.g.:
#   git tag -a v0.0.1 -m "VoxShift v0.0.1" && git push origin v0.0.1
# Assets: VoxShift-vX.Y.Z-win-x64-portable.exe, VoxShift-vX.Y.Z-win-x64.zip, SHA256SUMS.txt
# Alternatively run it manually ("Run workflow") with a tag such as v0.0.1: the workflow then creates the
# tag on the selected commit together with the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.0.1 (must match VersionPrefix)"
        required: true

permissions:
  contents: write # create the release and upload assets (GITHUB_TOKEN)
  id-token: write # short-lived OIDC token for code signing (no stored signing secrets; see docs/code-signing.md)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, sign & publish ${{ inputs.tag || github.ref_name }}
    runs-on: windows-2025
    # Only this environment may request signing: the Entra federated credential is bound to it (docs/code-signing.md).
    environment: release-signing
    env:
      # Non-secret identifiers, configured as repository (or environment) VARIABLES. No signing secret exists.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
      SIGNING_CERTIFICATE_PROFILE: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
      SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }} # optional: text the signer certificate subject must contain
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require code-signing configuration
        shell: pwsh
        run: |
          # Releases are never published unsigned: fail fast, before building, if signing is not configured.
          $required = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_CERTIFICATE_PROFILE'
          $missing = $required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "Code signing is not configured. Missing repository variables: $($missing -join ', '). See docs/code-signing.md. Refusing to publish an unsigned release." }
          if (-not $env:SIGNING_ENDPOINT.StartsWith('https://')) { throw 'SIGNING_ENDPOINT must be an https:// URL.' }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.1xx"

      - name: Verify tag matches project version
        id: version
        shell: pwsh
        run: |
          $v = (dotnet msbuild Directory.Build.props -getProperty:VersionPrefix).Trim()
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -ne "v$v") { throw "Tag '$tag' does not match the project version 'v$v' in Directory.Build.props." }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($v))\]" -Quiet)) { throw "CHANGELOG.md has no entry for $v." }
          if (-not (Test-Path "docs/release-notes/v$v.md")) { throw "Missing release notes docs/release-notes/v$v.md." }
          # Release title = first heading of the release notes, e.g. "VoxShift v0.0.3 — Soundboard Feature Release".
          $title = ((Get-Content "docs/release-notes/v$v.md" -Encoding utf8 -TotalCount 1) -replace '^#\s*', '').Trim()
          if (-not $title.StartsWith("VoxShift v$v")) { $title = "VoxShift v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "SOURCE_DATE_EPOCH=$((git log -1 --format=%ct).Trim())" >> $env:GITHUB_ENV

      - name: Verify documentation screenshots are in the tagged commit
        shell: pwsh
        run: |
          # Every image the README embeds must exist (screenshots are committed before tagging).
          $missing = @()
          foreach ($m in [regex]::Matches((Get-Content README.md -Raw -Encoding utf8), '(docs/screenshots/[^"''()\s]+\.png)')) {
            if (-not (Test-Path $m.Groups[1].Value)) { $missing += $m.Groups[1].Value }
          }
          if ($missing.Count -gt 0) { throw "README references missing screenshots: $($missing -join ', ')" }
          Write-Host "All README screenshots present."

      - name: Restore
        run: dotnet restore VoxShift.sln

      - name: Check formatting
        run: dotnet format VoxShift.sln --verify-no-changes --no-restore

      - name: Build & test
        run: |
          dotnet build VoxShift.sln -c Release --no-restore
          dotnet test tests/VoxShift.Core.Tests -c Release --no-build

      - name: Publish (self-contained, single file)
        run: dotnet publish src/VoxShift/VoxShift.csproj -c Release -r win-x64 -o publish

      - name: Azure login (OIDC, short-lived token)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign VoxShift.exe (Microsoft Artifact Signing, RFC 3161 timestamp)
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\publish\VoxShift.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VoxShift
          description-url: https://github.com/crapclap161/voxshift
          # Only the OIDC-backed Azure CLI session may be used.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signature of the published executable
        shell: pwsh
        run: ./scripts/verify-signature.ps1 -Path publish/VoxShift.exe -ExpectedSubject $env:SIGNING_PUBLISHER

      # The smoke test runs the SIGNED binary, so a signature that breaks the single-file bundle is caught here.
      - name: Smoke test (signed executable)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -ExePath publish/VoxShift.exe -ExpectedVersion ${{ steps.version.outputs.version }}

      # Package only after signing, so the portable EXE, the EXE inside the ZIP and the checksums all refer to the signed file.
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }} -PublishDir publish -OutputDir dist

      - name: Verify release assets (signatures and checksums)
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $portable = "dist/VoxShift-$tag-win-x64-portable.exe"
          $zip = "dist/VoxShift-$tag-win-x64.zip"
          $extract = Join-Path $env:RUNNER_TEMP 'zip-check'
          Expand-Archive $zip -DestinationPath $extract -Force
          $zipExe = Get-ChildItem $extract -Recurse -Filter VoxShift.exe | Select-Object -First 1
          if (-not $zipExe) { throw 'VoxShift.exe not found inside the ZIP.' }
          ./scripts/verify-signature.ps1 -Path $portable, $zipExe.FullName -ExpectedSubject $env:SIGNING_PUBLISHER
          if ((Get-FileHash $portable).Hash -ne (Get-FileHash $zipExe.FullName).Hash) { throw 'Portable EXE and the EXE inside the ZIP differ.' }
          # SHA256SUMS.txt must describe exactly the files that are about to be uploaded.
          $lines = Get-Content dist/SHA256SUMS.txt
          foreach ($file in $portable, $zip) {
            $expected = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $leaf = Split-Path -Leaf $file
            if (-not ($lines -contains "$expected  $leaf")) { throw "SHA256SUMS.txt does not contain the checksum of $leaf." }
          }
          Write-Host 'Signatures valid; ZIP and portable EXE identical; checksums match.'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          body_path: docs/release-notes/${{ steps.version.outputs.tag }}.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/VoxShift-${{ steps.version.outputs.tag }}-win-x64-portable.exe
            dist/VoxShift-${{ steps.version.outputs.tag }}-win-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
