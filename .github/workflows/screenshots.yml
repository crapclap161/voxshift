name: Screenshots

# Renders the real WPF UI (with sample devices – build machines have no microphone or virtual cable)
# to docs/screenshots/*.png and commits the result to the branch the workflow was started on.
#
# Run it manually ("Run workflow") on the release branch BEFORE tagging a release. It deliberately has no push
# trigger: an automatic run after a release commit used to push an extra "update screenshots" commit after the tag
# had been created, so the tagged release would not contain the final screenshots. The release workflow now checks
# that every screenshot the README embeds is present in the tagged commit.
on:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  screenshots:
    # Never on a tag: tags are immutable release points and must not receive commits.
    if: github.ref_type == 'branch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.1xx"

      - name: Build
        run: dotnet build src/VoxShift/VoxShift.csproj -c Release

      - name: Render screenshots
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse src\VoxShift\bin\Release -Filter VoxShift.exe | Select-Object -First 1
          $out = Join-Path $PWD "docs\screenshots"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--render-screenshots", "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Timed out" }
          Get-Content (Join-Path $env:LOCALAPPDATA "VoxShift\logs\VoxShift.log") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Rendering failed (exit code $($p.ExitCode))" }
          Get-ChildItem $out

      - name: Frame screenshots
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python docs/tools/compose_hero.py

      - name: Commit screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes"; exit 0 }
          git commit -m "docs: update README screenshots"
          git push origin HEAD:${{ github.ref_name }}
