name: Screenshots

# Renders the real WPF UI (with sample devices – build machines have no microphone or virtual cable)
# to docs/screenshots/*.png and commits the result to the branch the workflow was started on.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/VoxShift/Views/**"
      - "src/VoxShift/Themes/**"
      - "src/VoxShift/Services/ScreenshotRenderer.cs"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.1xx"

      - name: Build
        run: dotnet build src/VoxShift/VoxShift.csproj -c Release

      - name: Render screenshots
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse src\VoxShift\bin\Release -Filter VoxShift.exe | Select-Object -First 1
          $out = Join-Path $PWD "docs\screenshots"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--render-screenshots", "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Timed out" }
          Get-Content (Join-Path $env:LOCALAPPDATA "VoxShift\logs\VoxShift.log") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Rendering failed (exit code $($p.ExitCode))" }
          Get-ChildItem $out

      - name: Frame screenshots
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python docs/tools/compose_hero.py

      - name: Commit screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes"; exit 0 }
          git commit -m "docs: update README screenshots"
          git push origin HEAD:${{ github.ref_name }}
