name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Format, build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.1xx"

      - name: Restore
        run: dotnet restore VoxShift.sln

      - name: Check formatting
        run: dotnet format VoxShift.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build VoxShift.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/VoxShift.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  windows:
    name: Build, publish & smoke test (Windows)
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.1xx"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (dotnet msbuild Directory.Build.props -getProperty:VersionPrefix).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "VoxShift $v"

      - name: Restore
        run: dotnet restore VoxShift.sln

      - name: Build & test
        run: |
          dotnet build VoxShift.sln -c Release --no-restore
          dotnet test tests/VoxShift.Core.Tests -c Release --no-build

      - name: Publish (self-contained, single file)
        run: dotnet publish src/VoxShift/VoxShift.csproj -c Release -r win-x64 -o publish

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -ExePath publish/VoxShift.exe -ExpectedVersion ${{ steps.version.outputs.version }}

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }} -PublishDir publish -OutputDir dist

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        continue-on-error: true # artifact storage quota must never fail CI
        with:
          name: VoxShift-preview-win-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 7
